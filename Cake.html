<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cake Cutting</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="center">

  <div class="cake-container">
    <h1 class="wish-text">✨ Make a Wish ✨</h1>
    <div class="cake" id="cake">
      <div class="layer bottom"></div>
      <div class="layer top"></div>
      <div class="candle">
        <div class="flame"></div>
      </div>
    </div>

    <button class="btn" onclick="blowCandle()">Blow Candle 🕯️</button>
    <button class="btn" onclick="cutCake()">Cut the Cake 🎉</button>
    
    <a href="final.html" class="btn hidden" id="nextBtn">Next ➡️</a>
  </div>

  <div id="fireworks"></div>

  <script>
    function cutCake() {
      document.getElementById('cake').classList.add('cut');
      document.getElementById('fireworks').classList.add('show');
      document.getElementById('nextBtn').classList.remove('hidden');
    }

    function blowCandle() {
      document.querySelector('.flame').classList.add('off');
    }
  </script>
</body>
</html>
